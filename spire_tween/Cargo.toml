[package]
name = "spire_tween"
version = "1.3.2"
authors = ["Houtamelo"]
edition = "2024"
resolver = "3"
description = "A Slimy tweener library for Godot(4.4+), inspired on the design of DoTween."
license = "MIT"
repository = "https://github.com/Houtamelo/spire_tween_gdscript"
readme = "README.md"
categories = ["game-development", "api-bindings"]
keywords = ["godot", "tweening", "animation", "gdextension", "spire"]

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
godot = { version = "0.5", features = ["experimental-wasm", "register-docs"] }
keyframe = "1.1.1"
anyhow = "1.0"
spire_enum = "1.0.0"
glam = "0.30.5"
replace_with = "0.1.6"
indexmap = "2.12.0"
fxhash = "0.2.1"
derived-deref = "2.1.0"
smallvec = "1.15.1"
markdown = "1.0.0-alpha.23"
litrs = "0.4"
rand = "0.9.2"
rand_xoshiro = "0.7.0"
bitflags = "2.11.0"

[features]
include_gdext_lib = []
include_gdscript_bridge = []
nothreads = ["godot/experimental-wasm-nothreads"]
verbose-stdout = []

[[test]]
name = "must_compile"
path = "tests/must_compile.rs"